<!DOCTYPE html>

<head>

<meta name="theme-color" content="#351E1C">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--snow:#F5F4ED;--kite:#351E1C;--orange:#FF6037;--aqua:#A0C9CB;--dim:#DCCBC4;--faint:#A98C84;--serif:'Instrument Serif',Georgia,serif;--sans:'Geist',sans-serif;--mono:'Geist Mono',monospace}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:var(--sans);background:var(--kite);color:var(--snow);display:grid;place-items:center;padding:48px 28px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:hover{color:var(--orange)}
.mono{font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase}
main{width:100%;max-width:520px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:26px}
img.logo{height:56px;width:auto;filter:brightness(0) invert(1);opacity:.94}
.eyebrow{color:var(--aqua)}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.4rem,7vw,3.6rem);line-height:1.04;letter-spacing:-.02em}
h1 em{font-style:italic;color:var(--orange)}
p{font-size:1rem;line-height:1.7;color:var(--dim);text-wrap:pretty;max-width:420px}
.btn{display:inline-flex;align-items:center;gap:9px;padding:13px 26px;border-radius:40px;font-size:.9rem;font-weight:500;background:var(--orange);color:#fff;transition:background .2s,gap .2s,color .2s}
.btn:hover{background:#fff;color:var(--kite);gap:13px}
.lang{color:var(--faint);font-size:.8rem;border-bottom:1px solid rgba(169,140,132,.4);padding-bottom:2px}
.links{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.login{display:inline-flex;align-items:center;gap:7px;color:var(--aqua);font-size:.8rem;border-bottom:1px solid rgba(160,201,203,.4);padding-bottom:2px;transition:color .2s,border-color .2s}
.login:hover{color:var(--orange);border-color:rgba(255,96,55,.5)}
.login svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8}
footer{color:var(--faint)}
</style>
</head>
<body>
<main>
<img class="logo" src="images/jood-logo-dark.png" alt="JOOD Spaces">
<span class="mono eyebrow">Coming soon</span>
<h1>Designed homes,<br><em>professionally hosted</em></h1>
<p>We're putting the finishing touches on JOOD Spaces.</p>
<a class="btn" href="JOOD Unit Transformation - Villa Dunes.html">View the proposal <span>&rarr;</span></a>
<div class="links"><a class="login" href="portal/login.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Owner login</a><a class="lang" href="index.html" dir="rtl">العربية</a></div>
<footer class="mono">JOOD Spaces &middot; Egypt</footer>
</main>
</body>
</html>
