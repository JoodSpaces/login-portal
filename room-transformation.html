<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JOOD — Villa Dunes · Transformation</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Spectral:ital,wght@0,400;0,500;1,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    /* ---- Brand: warm dark (Black Kite) default ---- */
    --bg: #351E1C;          /* Black Kite */
    --panel: #43272340;     /* raised warm surface (set solid below) */
    --panel: #432723;
    --ink: #F5F4ED;         /* Morning Snow */
    --ink-soft: #DCCBC4;
    --muted: #A98C84;
    --line: rgba(245,244,237,0.13);
    --line-strong: rgba(245,244,237,0.28);
    --accent: #FF6037;      /* Toxic Orange */
    --accent-soft: rgba(255,96,55,0.16);
    --teal: #A0C9CB;        /* Aqua Mist */
    --garnet: #733635;      /* Garnet */
    --frame-bg: #2a1512;
    --slot-bg: #311a16;
    --reg: rgba(245,244,237,0.82);
    --handle-fill: #F5F4ED;
    --shadow: 0 22px 60px -26px rgba(0,0,0,0.7);
    --font-ui: 'Geist', system-ui, sans-serif;
    --font-display: 'Instrument Serif', Georgia, serif;
    --font-mono: 'Geist Mono', ui-monospace, monospace;
  }
  /* ---- Arabic typography + RTL ---- */
  html[data-lang="ar"] {
    --font-ui: 'IBM Plex Sans Arabic', 'Geist', system-ui, sans-serif;
    --font-mono: 'IBM Plex Sans Arabic', ui-monospace, monospace;
  }
  html[data-lang="ar"] body, html[data-lang="ar"] body * { letter-spacing: 0; }
  html[data-lang="ar"] .info-blurb { font-size: 15px; line-height: 1.85; }
  html[data-lang="ar"] .mat-spec { font-size: 12.5px; }
  html[data-lang="ar"] .info-name { line-height: 1.25; }
  html[data-lang="ar"] .info-count { white-space: nowrap; }
  html[data-lang="ar"] .info-count b, html[data-lang="ar"] .info-count .of { unicode-bidi: isolate; }
  [dir="rtl"] .scrub-tick, [dir="rtl"] .scrub-handle { transform: translate(50%, -50%); }
  [dir="rtl"] .tick-num, [dir="rtl"] .scrub-label { transform: translateX(50%); }
  [dir="rtl"] .backarrow { transform: scaleX(-1); }
  .langbtn {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 46px; padding: 8px 13px; border-radius: 40px;
    border: 1.5px solid var(--line-strong); background: transparent;
    color: var(--ink-soft); font-family: var(--font-ui); font-size: 12px; font-weight: 600;
    letter-spacing: 0.04em; cursor: pointer; transition: all .2s; flex-shrink: 0;
  }
  .langbtn:hover { border-color: var(--accent); color: var(--accent); }
  .topbar-left { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  :root[data-mode="light"] {
    /* ---- Brand: light (Morning Snow / Amazon Mist) ---- */
    --bg: #ECECDC;          /* Amazon Mist */
    --panel: #F5F4ED;       /* Morning Snow */
    --ink: #351E1C;         /* Black Kite */
    --ink-soft: #5C3D38;
    --muted: #927B74;
    --line: rgba(53,30,28,0.12);
    --line-strong: rgba(53,30,28,0.24);
    --accent-soft: rgba(255,96,55,0.13);
    --frame-bg: #ddd5c9;
    --slot-bg: #e6ded2;
    --reg: rgba(53,30,28,0.55);
    --handle-fill: #F5F4ED;
    --shadow: 0 18px 50px -24px rgba(53,30,28,0.42);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  body.scrubbing { cursor: grabbing; user-select: none; }
  /* embed mode — hide topbar so the tool fills the iframe fully */
  [data-embed='1'] .topbar { display: none !important; }
  [data-embed='1'] html, [data-embed='1'] body { height: auto; overflow: visible; }
  [data-embed='1'] .app { height: auto; min-height: 0; padding: clamp(10px,1.6vw,20px); gap: clamp(8px,1.2vw,16px); }
  /* embed: stack frame above info, no forced viewport heights, no internal scroll */
  [data-embed='1'] .stagewrap { grid-template-columns: 1fr; grid-template-rows: none; }
  [data-embed='1'] .frame { max-height: 620px; max-width: 100%; }
  [data-embed='1'] .info { flex-direction: column; height: auto; }
  [data-embed='1'] .info-body { overflow: visible; min-height: auto; }
  [data-embed='1'] .info-nav { flex-direction: row; }
  #root { height: 100%; }

  .app {
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: clamp(14px, 2.2vw, 30px);
    gap: clamp(12px, 1.6vw, 22px);
  }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: clamp(10px, 1.4vw, 16px);
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
    gap: 6px 18px;
  }
  .brand { display: flex; align-items: center; gap: 11px; flex: 0 0 auto; }
  .brand-name {
    font-family: var(--font-ui);
    font-size: clamp(17px, 1.6vw, 22px);
    letter-spacing: 0.2em;
    font-weight: 600;
    display: inline-flex; align-items: flex-end; gap: 2px;
  }
  .brand-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-bottom: 4px; }
  .brand-sub {
    font-family: var(--font-mono);
    font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted);
    padding-inline-start: 13px; border-inline-start: 1px solid var(--line-strong);
  }
  .project { text-align: end; display: flex; flex-direction: column; gap: 3px; flex: 0 1 auto; min-width: 0; }
  .project-name {
    font-family: var(--font-display);
    font-size: clamp(17px, 1.6vw, 22px);
    font-weight: 400;
    color: var(--ink);
    white-space: nowrap;
  }
  .project-name em { font-style: italic; }
  .project-meta {
    font-family: var(--font-mono);
    font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
  }

  /* ---------- main split ---------- */
  .stagewrap {
    flex: 1;
    min-height: 0;
    display: grid;
    gap: clamp(18px, 2.4vw, 40px);
    grid-template-columns: minmax(0,1fr) clamp(320px, 28vw, 400px);
    align-items: stretch;
  }

  .viewer { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 14px; justify-content: center; }

  /* ---------- frame ---------- */
  .frame {
    position: relative;
    width: 100%;
    margin: 0 auto;
    aspect-ratio: var(--frame-ratio, 3 / 2);
    max-height: 60vh;
    max-width: var(--frame-max-w, calc(60vh * 1.5));
  }
  .frame-layers {
    position: absolute; inset: 0;
    background: var(--frame-bg);
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .layer { position: absolute; inset: 0; }
  .layer image-slot { --slot-bg: var(--slot-bg); }

  .reg { position: absolute; width: 13px; height: 13px; z-index: 40; pointer-events: none; opacity: 0.85; }
  .reg::before, .reg::after { content: ""; position: absolute; background: var(--reg); }
  .reg::before { width: 13px; height: 1.5px; top: 0; }
  .reg::after { width: 1.5px; height: 13px; left: 0; }
  .reg-tl { top: 9px; left: 9px; }
  .reg-tr { top: 9px; right: 9px; transform: scaleX(-1); }
  .reg-bl { bottom: 9px; left: 9px; transform: scaleY(-1); }
  .reg-br { bottom: 9px; right: 9px; transform: scale(-1); }

  .frame-tag {
    position: absolute; inset-inline-start: 0; bottom: 0; z-index: 30;
    display: flex; align-items: baseline; gap: 10px;
    padding: 9px 16px 9px 14px;
    background: rgba(26,12,10,0.7);
    backdrop-filter: blur(6px);
    color: #f4efe8;
  }
  .frame-tag-n { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.06em; color: var(--accent); }
  .frame-tag-name { font-family: var(--font-display); font-style: italic; font-weight: 400; font-size: clamp(16px,1.6vw,21px); letter-spacing: 0.01em; }

  /* ---------- scrubber ---------- */
  .scrub-hint {
    text-align: center; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted);
  }
  .hint-arrows { color: var(--accent); font-size: 13px; margin-right: 4px; }

  .scrubber { padding: 4px clamp(8px, 2vw, 26px) 0; }
  .scrub-track-wrap { padding: 18px 0 0; }
  .scrub-track {
    position: relative; height: 26px; cursor: pointer;
  }
  .scrub-track::before {
    content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px;
    transform: translateY(-50%); background: var(--line-strong); border-radius: 2px;
  }
  .scrub-fill {
    position: absolute; inset-inline-start: 0; top: 50%; height: 2px; transform: translateY(-50%);
    background: var(--accent); border-radius: 2px; pointer-events: none;
  }
  .scrub-tick {
    position: absolute; top: 50%; transform: translate(-50%, -50%);
    width: 26px; height: 26px; border: none; background: none; padding: 0; cursor: pointer;
    display: grid; place-items: center;
  }
  .tick-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--bg); border: 2px solid var(--line-strong);
    transition: border-color .25s, background .25s, transform .25s;
  }
  .scrub-tick.is-passed .tick-dot { border-color: var(--accent); }
  .scrub-tick.is-near .tick-dot { background: var(--accent); border-color: var(--accent); transform: scale(1.05); }
  .tick-num {
    position: absolute; bottom: calc(100% - 1px); inset-inline-start: 50%; transform: translateX(-50%);
    font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); letter-spacing: 0.02em;
    transition: color .25s, opacity .25s; opacity: 0.55;
  }
  .scrub-tick.is-near .tick-num { color: var(--accent); opacity: 1; }

  .scrub-handle {
    position: absolute; top: 50%; transform: translate(-50%, -50%);
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--handle-fill); border: 1.5px solid var(--accent);
    box-shadow: 0 4px 14px -3px rgba(0,0,0,0.5);
    pointer-events: none; display: grid; place-items: center; z-index: 5;
  }
  .handle-grip { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }

  .scrub-labels { position: relative; height: 18px; margin-top: 14px; }
  .scrub-label {
    position: absolute; top: 0; transform: translateX(-50%);
    border: none; background: none; padding: 0; cursor: pointer; white-space: nowrap;
    font-family: var(--font-ui); font-size: 11px; color: var(--muted);
    letter-spacing: 0.02em; transition: color .25s;
  }
  .scrub-label:hover { color: var(--ink-soft); }
  .scrub-label.is-near { color: var(--ink); font-weight: 600; }

  /* ---------- info panel ---------- */
  .info {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: clamp(20px, 1.8vw, 30px);
    display: flex; flex-direction: column;
    min-height: 0;
  }
  .layout-bottom .info { flex-direction: row; gap: clamp(24px, 4vw, 60px); align-items: stretch; }

  .info-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; border: none; background: none; padding: 0; cursor: pointer; font: inherit; color: inherit; text-align: left; }
  .info-top-right { display: flex; align-items: center; gap: 10px; }
  .info-chevron { display: flex; color: var(--muted); transition: transform .25s; }
  .info-chevron.is-open { transform: rotate(180deg); color: var(--accent); }
  .info-toggle-label { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); white-space: nowrap; }
  .info-eyebrow { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); }
  .state-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .state-before { background: var(--garnet); }
  .state-work { background: var(--accent); }
  .state-after { background: var(--teal); }
  .info-count { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: 0.02em; }
  .info-count b { color: var(--accent); font-size: 13px; font-weight: 700; }
  .info-count .of { opacity: 0.7; }

  .layout-bottom .info-top { flex-direction: column; align-items: flex-start; gap: 10px; min-width: 130px; justify-content: center; border-inline-end: 1px solid var(--line); padding-inline-end: clamp(24px,4vw,60px); }

  .info-body { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding-top: clamp(16px, 1.6vw, 24px); scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  [data-embed='1'] .info-nav { margin-top: clamp(16px, 1.6vw, 22px); }
  .info-body::-webkit-scrollbar { width: 6px; }
  .info-body::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 6px; }
  .layout-bottom .info-body { overflow: visible; }
  .info-name {
    font-family: var(--font-display); font-weight: 400;
    font-size: clamp(34px, 3.6vw, 50px); line-height: 1.0; margin: 0 0 14px;
    letter-spacing: 0;
  }
  .info-name em { font-style: italic; }
  .info-blurb { font-size: 14.5px; line-height: 1.6; color: var(--ink-soft); margin: 0 0 clamp(20px,2vw,28px); max-width: 42ch; text-wrap: pretty; }

  .mat-head { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); padding-bottom: 10px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
  .mat-list { list-style: none; margin: 0; padding: 0; }
  .mat-row {
    display: flex; align-items: baseline; gap: 8px;
    padding: 11px 0; border-bottom: 1px solid var(--line);
    animation: matIn .5s cubic-bezier(.2,.7,.2,1);
  }
  .mat-name { font-size: 14px; font-weight: 600; color: var(--ink); white-space: nowrap; }
  .mat-dots { flex: 1; border-bottom: 1px dotted var(--line-strong); transform: translateY(-3px); }
  .mat-spec { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); text-align: end; }

  .info-body { animation: bodyIn .45s ease; }
  @keyframes bodyIn { from { transform: translateY(8px); } to { transform: none; } }
  @keyframes matIn { from { transform: translateY(7px); } to { transform: none; } }

  .info-nav { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding-top: clamp(16px,1.6vw,22px); margin-top: auto; }
  .layout-bottom .info-nav { flex-direction: column; margin-top: 0; padding-top: 0; justify-content: center; border-inline-start: 1px solid var(--line); padding-inline-start: clamp(24px,4vw,60px); min-width: 150px; }
  .navbtn {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid var(--line-strong); background: transparent; color: var(--ink);
    font-family: var(--font-ui); font-size: 12px; letter-spacing: 0.04em;
    padding: 9px 15px; border-radius: 2px; cursor: pointer; transition: all .2s;
  }
  .navbtn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .navbtn:disabled { opacity: 0.35; cursor: default; }
  .navarrow { font-size: 14px; }
  .navprog { display: flex; gap: 5px; }
  .prog-pip { width: 6px; height: 6px; border-radius: 50%; background: var(--line-strong); transition: background .25s; }
  .prog-pip.on { background: var(--accent); }

  /* ---------- responsive ---------- */
  @media (max-width: 880px) {
    body { overflow: auto; }
    .app { height: auto; min-height: 100%; }
    .stagewrap, .layout-right .stagewrap, .layout-bottom .stagewrap { grid-template-columns: 1fr; grid-template-rows: none; }
    .frame, .layout-bottom .frame { max-height: 46vh; max-width: 100%; }
    .layout-bottom .info, .layout-bottom .info-top, .layout-bottom .info-nav { flex-direction: column; border: none; padding-inline: 0; margin: 0; }
    .layout-bottom .info-nav { border-top: 1px solid var(--line); padding-top: 18px; margin-top: 8px; }
    /* let info panel grow naturally — no fixed height to flex into on mobile */
    .info { height: auto; min-height: 0; }
    .info-body { overflow-y: visible; flex: none; min-height: auto; }
    .info-nav { margin-top: 18px; }
  }
  @media (max-width: 680px) {
    .scrub-labels { display: none; }
    .tick-num { display: none; }
    .project { text-align: start; }
    .topbar { flex-wrap: nowrap; }
  }
</style>
</head>
<body>
  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#351E1C"/>
      <g transform="translate(30 30)">
        <path d="M0 18 L20 2 L40 18 L40 40 L0 40 Z" fill="none" stroke="#F5F4ED" stroke-width="3" stroke-linejoin="round"/>
        <rect x="14" y="26" width="12" height="14" fill="#FF6037"/>
      </g>
      <circle cx="76" cy="24" r="4" fill="#FF6037"/>
    </svg>
  </template>
  <div id="root"></div>

  <script>
    /* Read ?room= and ?embed=1 before React mounts */
    (function(){
      var p = new URLSearchParams(location.search);
      window.ROOM_ID = p.get('room') || 'default';
      var lp = p.get('lang');
      window.ROOM_LANG = (lp === 'ar' || lp === 'en') ? lp : (localStorage.getItem('jood_lang') || 'ar');
      if (p.get('embed') === '1') document.documentElement.dataset.embed = '1';
    })();
  </script>
  <script src="room-tool/image-slot.js?v=20260808"></script>
  <script src="room-tool/stages.js?v=20260808"></script>
  <script src="room-tool/i18n.js?v=20260813"></script>
  <script src="room-tool/images.js?v=20260808"></script>
  <script src="room-tool/images-baked.js?v=20260808"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="room-tool/tweaks-panel.jsx"></script>
  <script type="text/babel" src="room-tool/components.jsx"></script>
  <script type="text/babel" src="room-tool/app.jsx"></script>
  <script>
    // Embed mode: report our real content height to the parent so the
    // hosting iframe can size to fit — otherwise a fixed guessed height
    // clips the info panel whenever a stage's text runs longer.
    (function(){
      if (document.documentElement.dataset.embed !== '1') return;
      function report(){
        var h = document.getElementById('root').scrollHeight;
        window.parent.postMessage({ __roomToolHeight: h, room: window.ROOM_ID }, '*');
      }
      window.addEventListener('load', report);
      setTimeout(report, 300);
      setTimeout(report, 1200);
      new ResizeObserver(report).observe(document.getElementById('root'));
    })();
  </script>
</body>
</html>
