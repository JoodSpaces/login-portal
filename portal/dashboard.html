<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOOD — Owner Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --snow:#F5F4ED; --mist:#ECECDC; --mist2:#D9D6C3; --kite:#351E1C; --garnet:#733635;
    --orange:#FF6037; --aqua:#A0C9CB; --mid:#8A6663; --border:rgba(53,30,28,.12);
    --serif:'Instrument Serif',Georgia,serif; --sans:'Geist',sans-serif; --mono:'Geist Mono',monospace;
    --r:12px; --ease:cubic-bezier(.22,1,.36,1);
    --sidebar-w:236px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  a{color:inherit;text-decoration:none}
  a:hover{color:var(--orange)}
  button{cursor:pointer;border:none;background:none;font-family:inherit}
  body{
    font-family:var(--sans); color:var(--kite); background:var(--mist); line-height:1.5;
    display:flex; min-height:100vh;
  }
  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-thumb{background:var(--mid);border-radius:6px}

  /* ── SIDEBAR ─────────────────────────────────────────── */
  .sidebar{
    width:var(--sidebar-w); flex-shrink:0; background:var(--kite); color:var(--snow);
    display:flex; flex-direction:column; padding:26px 18px; gap:30px;
    position:sticky; top:0; height:100vh;
  }
  .sb-logo{padding:0 8px}
  .sb-logo img{height:36px;width:auto;display:block;filter:brightness(0) invert(1)}
  .sb-nav{display:flex;flex-direction:column;gap:2px;flex:1}
  .sb-item{
    display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:9px;
    font-size:.84rem;font-weight:500;color:#DCCBC4;transition:background .18s,color .18s;text-align:left;width:100%;
  }
  .sb-item svg{flex-shrink:0;opacity:.85}
  .sb-item:hover{background:rgba(245,244,237,.06);color:var(--snow)}
  .sb-item.active{background:var(--orange);color:var(--kite)}
  .sb-item.active svg{opacity:1}
  .sb-item.disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
  .sb-divider{height:1px;background:rgba(245,244,237,.1);margin:6px 4px}
  .sb-foot{display:flex;flex-direction:column;gap:2px}
  .sb-account{display:flex;align-items:center;gap:10px;padding:8px 10px}
  .sb-avatar{width:32px;height:32px;border-radius:50%;background:rgba(245,244,237,.12);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.66rem;font-weight:600;flex-shrink:0}
  .sb-account-name{font-size:.78rem;font-weight:500}
  .sb-account-unit{font-size:.68rem;color:#A98C84;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
  .sb-signout{font-size:.76rem;color:#A98C84;padding:9px 12px;display:flex;align-items:center;gap:9px}
  .sb-signout:hover{color:var(--orange)}

  /* ── MAIN ────────────────────────────────────────────── */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:20px;
    padding:22px 40px;border-bottom:1px solid var(--border);background:rgba(245,244,237,.6);
    backdrop-filter:blur(10px); position:sticky; top:0; z-index:5;
  }
  .tb-title{font-family:var(--serif);font-size:1.5rem;font-weight:400}
  .tb-sub{font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mid);margin-top:3px}
  .tb-badge{
    font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;
    padding:6px 14px;border-radius:40px;white-space:nowrap;flex-shrink:0;
  }
  .badge-ready{background:rgba(255,96,55,.12);color:var(--garnet)}
  .badge-review{background:rgba(160,201,203,.22);color:#2c5658}
  .badge-live{background:var(--kite);color:var(--snow)}

  .content{padding:36px 40px 80px;max-width:1180px}
  .panel{display:none}
  .panel.active{display:block}

  .eyebrow{font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mid);margin-bottom:10px}

  /* ── OVERVIEW GRID ───────────────────────────────────── */
  .grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;margin-bottom:20px}
  .card{background:var(--snow);border:1px solid var(--border);border-radius:var(--r);padding:26px}
  .card h3{font-family:var(--serif);font-size:1.2rem;font-weight:400;margin-bottom:4px}
  .card .lede{font-size:.82rem;color:var(--mid);margin-bottom:18px}

  .tb-unitpick{font-family:inherit;font-size:.78rem;color:var(--ink);background:var(--card);border:1px solid var(--border);border-radius:8px;padding:7px 10px;max-width:230px;cursor:pointer}
  .tb-unitpick:hover{border-color:var(--accent)}
  .snap-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:6px}
  .snap-cell{border-top:1px solid var(--border);padding-top:12px}
  .snap-k{font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mid);margin-bottom:5px}
  .snap-v{font-family:var(--serif);font-size:1.15rem}

  .stat-big{font-family:var(--serif);font-size:2.1rem;margin-bottom:2px}
  .stat-note{font-size:.78rem;color:var(--mid)}

  .quick-actions{display:flex;flex-direction:column;gap:10px}
  .qa-btn{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:15px 18px;border:1.5px solid var(--border);border-radius:10px;
    transition:border-color .2s,background .2s;font-size:.86rem;font-weight:500;
  }
  .qa-btn:hover{border-color:var(--orange);background:rgba(255,96,55,.05);color:var(--kite)}
  .qa-btn.disabled{opacity:.4;pointer-events:none}
  .qa-btn svg{flex-shrink:0;color:var(--mid)}

  .grid3{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .list-row{
    display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--border);
  }
  .list-row:last-child{border-bottom:none}
  .list-icon{
    width:36px;height:36px;border-radius:9px;background:var(--mist);display:flex;align-items:center;justify-content:center;
    color:var(--mid);flex-shrink:0;
  }
  .list-body{flex:1;min-width:0}
  .list-title{font-size:.84rem;font-weight:500}
  .list-meta{font-size:.72rem;color:var(--mid);margin-top:2px}
  .link-more{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--mid);margin-top:14px}
  .link-more:hover{color:var(--orange)}

  /* ── DOCUMENTS ───────────────────────────────────────── */
  .doc-row{
    display:flex;align-items:center;gap:16px;padding:16px 20px;background:var(--snow);
    border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;
  }
  .doc-icon{
    width:42px;height:42px;border-radius:9px;background:var(--mist);display:flex;align-items:center;justify-content:center;
    color:var(--garnet);flex-shrink:0;font-family:var(--mono);font-size:.62rem;font-weight:700;letter-spacing:.02em;
  }
  .doc-body{flex:1;min-width:0}
  .doc-title{font-size:.88rem;font-weight:500}
  .doc-meta{font-size:.74rem;color:var(--mid);margin-top:3px}
  .doc-dl{
    font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;
    padding:8px 16px;border:1.5px solid var(--border);border-radius:40px;color:var(--mid);flex-shrink:0;
    transition:border-color .2s,color .2s;
  }
  .doc-dl:hover{border-color:var(--kite);color:var(--kite)}

  /* ── MESSAGES ────────────────────────────────────────── */
  .msg-row{display:flex;gap:16px;padding:20px 0;border-bottom:1px solid var(--border)}
  .msg-row:last-child{border-bottom:none}
  .msg-avatar{
    width:38px;height:38px;border-radius:50%;background:var(--kite);color:var(--snow);
    display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.66rem;font-weight:600;flex-shrink:0;
  }
  .msg-body{flex:1;min-width:0}
  .msg-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:5px}
  .msg-from{font-size:.86rem;font-weight:600}
  .msg-time{font-family:var(--mono);font-size:.68rem;color:var(--mid);white-space:nowrap}
  .msg-text{font-size:.86rem;color:#4a2e2b;line-height:1.65}
  .msg-unread{width:7px;height:7px;border-radius:50%;background:var(--orange);flex-shrink:0;margin-top:6px}

  .empty-note{font-size:.84rem;color:var(--mid);padding:30px 0;text-align:center}

  .toast{
    position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(12px);
    background:var(--kite);color:var(--snow);padding:12px 22px;border-radius:40px;font-size:.82rem;
    opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:100;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .menu-toggle{display:none}
  .sidebar-backdrop{display:none}
  @media (max-width:900px){
    .menu-toggle{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:9px;border:1.5px solid var(--border);color:var(--kite);flex-shrink:0}
    .sidebar{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:transform .25s}
    .sidebar.open{transform:translateX(0)}
    .sidebar-backdrop.open{display:block;position:fixed;inset:0;background:rgba(53,30,28,.4);z-index:55}
    .grid2,.grid3{grid-template-columns:1fr}
    .snap-row{grid-template-columns:repeat(2,1fr)}
    .content{padding:28px 20px 60px}
    .topbar{padding:18px 20px}
  }
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="sb-logo"><img src="../images/jood-logo-dark.png" alt="JOOD"></div>
  <nav class="sb-nav">
    <button class="sb-item active" data-panel="overview" onclick="showPanel('overview')">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1.5" y="1.5" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="8.5" y="1.5" width="6" height="9" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="1.5" y="9.5" width="6" height="5" rx="1" stroke="currentColor" stroke-width="1.4"/></svg>
      Overview
    </button>
    <button class="sb-item" id="nav-proposal" data-panel="_link">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 1.5h7l3 3v10h-10v-13Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M5.5 7h5M5.5 9.5h5M5.5 12h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      Transformation Proposal
    </button>
    <div class="sb-divider"></div>
    <button class="sb-item" onclick="window.location.href='../tracker/index.html'">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M1.5 5.5h13" stroke="currentColor" stroke-width="1.4"/><path d="M4 8.5h2.5M4 11h4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      Guest &amp; Finance Tracker
    </button>
    <div class="sb-divider"></div>
    <button class="sb-item" data-panel="documents" onclick="showPanel('documents')">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 1.5h5.5L12 4v10.5H4v-13Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M6 7h4M6 9.5h4M6 12h2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      Documents
    </button>
    <button class="sb-item" data-panel="messages" onclick="showPanel('messages')">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M1.5 3.5h13v8h-8L3 14v-2.5H1.5v-8Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
      Messages
      <span id="msgDot" style="display:none;width:6px;height:6px;border-radius:50%;background:var(--orange);margin-left:auto"></span>
    </button>
  </nav>
  <div class="sb-foot">
    <div class="sb-account">
      <div class="sb-avatar" id="sbAvatar">—</div>
      <div style="min-width:0">
        <div class="sb-account-name" id="sbName">—</div>
        <div class="sb-account-unit" id="sbUnit">—</div>
      </div>
    </div>
    <button class="sb-signout" onclick="signOut()">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5.5 1.5H2.5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M9 4.5 12 7l-3 2.5M12 7H5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Sign out
    </button>
  </div>
</aside>

<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

<main class="main">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:14px">
      <button class="menu-toggle" onclick="openSidebar()" aria-label="Open menu">
        <svg width="18" height="14" viewBox="0 0 18 14" fill="none"><path d="M1 1h16M1 7h16M1 13h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <div>
        <div class="tb-title" id="tbTitle">—</div>
        <div class="tb-sub" id="tbSub">—</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:12px"><select class="tb-unitpick" id="tbUnitPick" onchange="switchUnit(this.value)" data-i18n-skip hidden></select><span data-lang-slot></span><div class="tb-badge" id="tbBadge">—</div></div>
  </div>

  <div class="content">

    <!-- OVERVIEW -->
    <section class="panel active" id="panel-overview">
      <div class="grid2">
        <div class="card">
          <div class="eyebrow">Your Unit</div>
          <h3 id="ov-unit-name">—</h3>
          <div class="lede" id="ov-unit-location">—</div>
          <div class="snap-row" id="ov-specs"></div>
        </div>
        <div class="card" id="ov-income-card">
          <div class="eyebrow">Projected Owner Income</div>
          <div class="stat-big" id="ov-income">—</div>
          <div class="stat-note" id="ov-income-note">—</div>
          <div class="quick-actions" style="margin-top:22px" id="ov-actions"></div>
        </div>
      </div>

      <div class="grid3">
        <div class="card">
          <h3 style="font-size:1.05rem;margin-bottom:2px">Recent Documents</h3>
          <div class="lede" style="margin-bottom:4px">Latest from JOOD</div>
          <div id="ov-docs"></div>
          <a class="link-more" onclick="showPanel('documents')" href="javascript:void(0)">View all documents →</a>
        </div>
        <div class="card">
          <h3 style="font-size:1.05rem;margin-bottom:2px">Recent Messages</h3>
          <div class="lede" style="margin-bottom:4px">Updates from the JOOD team</div>
          <div id="ov-msgs"></div>
          <a class="link-more" onclick="showPanel('messages')" href="javascript:void(0)">View all messages →</a>
        </div>
      </div>
    </section>

    <!-- DOCUMENTS -->
    <section class="panel" id="panel-documents">
      <div class="eyebrow">Documents</div>
      <h3 style="font-family:var(--serif);font-size:1.6rem;font-weight:400;margin-bottom:22px">Contracts &amp; paperwork</h3>
      <div id="doc-list"></div>
    </section>

    <!-- MESSAGES -->
    <section class="panel" id="panel-messages">
      <div class="eyebrow">Messages</div>
      <h3 style="font-family:var(--serif);font-size:1.6rem;font-weight:400;margin-bottom:8px">Updates from JOOD</h3>
      <div class="card" style="margin-top:18px" id="msg-list"></div>
    </section>

  </div>
</main>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script>
let acc = null;
let allUnits = [];

function initials(str){
  return (str||'').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase() || '—';
}
function timeAgo(iso){
  const d = new Date(iso); const diff = (Date.now()-d.getTime())/1000;
  if (diff < 3600) return Math.max(1,Math.round(diff/60))+'m ago';
  if (diff < 86400) return Math.round(diff/3600)+'h ago';
  if (diff < 86400*7) return Math.round(diff/86400)+'d ago';
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
}
const STAGE_LABEL = { review:'Design direction in review', ready:'Ready for sign-off', live:'Live · earning' };

async function loadAccount(){
  const { data: sessionData } = await sb.auth.getSession();
  if (!sessionData.session) { window.location.href = 'login.html'; return null; }
  const user = sessionData.session.user;

  // role comes from public.profiles; admins get every unit, owners only their own
  let role = 'owner';
  try {
    const { data: prof } = await sb.from('profiles').select('role').eq('id', user.id).maybeSingle();
    if (prof && prof.role) role = prof.role;
  } catch(e){}

  const q = sb.from('units').select('*').order('name');
  const { data: units, error: unitErr } = role === 'admin' ? await q : await q.eq('owner_id', user.id);
  if (unitErr) { console.error(unitErr); }

  allUnits = units || [];
  // remembered selection for admins flipping between units
  const wanted = role === 'admin' ? localStorage.getItem('jood_admin_unit') : null;
  const unit = allUnits.find(u => String(u.id) === wanted) || allUnits[0] || null;

  let documents = [], messages = [];
  if (unit) {
    const [{ data: docs }, { data: msgs }] = await Promise.all([
      sb.from('documents').select('*').eq('unit_id', unit.id).order('created_at', { ascending:false }),
      sb.from('messages').select('*').eq('unit_id', unit.id).order('created_at', { ascending:false }),
    ]);
    documents = (docs||[]).map(d=>({ title:d.title, meta:d.meta, tag:d.tag }));
    messages = (msgs||[]).map(m=>({ from:m.from_name, time:timeAgo(m.created_at), text:m.body, unread:m.unread }));
  }

  const displayName = user.user_metadata && user.user_metadata.full_name ? user.user_metadata.full_name : user.email;

  return {
    role, allUnits, unitId: unit ? unit.id : null,
    name: displayName,
    initials: initials(displayName),
    unitLinked: !!unit,
    unit: unit ? unit.name : 'No unit assigned yet',
    location: unit ? unit.location : 'Contact your JOOD project lead',
    stage: unit ? unit.stage : 'review',
    stageLabel: unit ? (unit.stage_label || STAGE_LABEL[unit.stage] || unit.stage) : 'Awaiting setup',
    specs: unit ? unit.specs : [],
    income: unit ? unit.income : '—',
    incomeNote: unit ? unit.income_note : 'No unit linked to your account yet',
    proposalUrl: unit ? unit.proposal_url : null,
    roomToolUrl: unit ? unit.room_tool_url : null,
    documents, messages,
  };
}

function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }
function showToast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(window.__toastTimer); window.__toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}
async function signOut(){ await sb.auth.signOut(); window.location.href='login.html'; }

function showPanel(name){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  document.querySelectorAll('.sb-item[data-panel]').forEach(b=>b.classList.toggle('active', b.dataset.panel===name));
  closeSidebar();
}
function openSidebar(){
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarBackdrop').classList.add('open');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('open');
}

// Projection now lives in Supabase (table `projections`, single row id=1).
// Editing usd/fx/occ/fee there updates this card live for every visitor.
// No hardcoded numbers: the row in Supabase is the only source.
async function sharedProjection(){
  try {
    const { data } = await sb.from('projections').select('*').eq('id',1).maybeSingle();
    if (!data) return null;
    return Object.assign({}, data, { monthlyEgp: Math.round(data.usd * data.fx) });
  } catch(e){ return null; }
}
async function renderIncome(){
  const card = document.getElementById('ov-income-card');
  const big = document.getElementById('ov-income'), note = document.getElementById('ov-income-note');
  const ar = document.documentElement.getAttribute('data-lang') === 'ar';
  // No unit linked (e.g. the admin account) => no projection to show.
  if (!acc || !acc.unitLinked){
    if (card) card.style.display = 'none';
    return;
  }
  if (card) card.style.display = '';
  const p = await sharedProjection();
  if (!p){
    big.textContent = '—';
    note.textContent = ar ? 'لم يتم تحديد التوقعات بعد' : 'Projection not set yet';
    return;
  }
  // Built per-language here so the i18n text-node dictionary never half-translates it.
  const usd = '$' + Number(p.usd).toLocaleString('en-US');
  big.textContent = ar ? (usd + ' / شهريًا') : (usd + ' / month');
  note.textContent = ar
    ? '\u2248' + p.monthlyEgp.toLocaleString('ar-EG') + ' ج.م · نسبة إشغال ' + p.occ + '% — متوقع شهريًا، بعد خصم رسوم إدارة جود البالغة ' + p.fee + '%'
    : '\u2248' + p.monthlyEgp.toLocaleString('en-US') + ' EGP · ' + p.occ + '% occupancy — projected monthly, net of JOOD\'s ' + p.fee + '% management fee';
  note.setAttribute('data-i18n-skip','');
  big.setAttribute('data-i18n-skip','');
}
// re-render the note when the language is toggled
window.addEventListener('joodlang', () => { if (document.getElementById('ov-income')) renderIncome(); });
// live-refresh whenever the row changes in Supabase (any device/tab)
if (sb) sb.channel('projections-live').on('postgres_changes', { event:'*', schema:'public', table:'projections' }, () => { if (document.getElementById('ov-income')) renderIncome(); }).subscribe();

function docIconTag(tag){ return tag; }

function render(){
  document.getElementById('sbAvatar').textContent = acc.initials;
  document.getElementById('sbName').textContent = acc.name;
  document.getElementById('sbUnit').textContent = acc.unit;
  document.getElementById('tbTitle').textContent = acc.unit;
  document.getElementById('tbSub').textContent = acc.location;

  renderUnitPicker();

  const badge = document.getElementById('tbBadge');
  badge.textContent = acc.stageLabel;
  badge.className = 'tb-badge ' + (acc.stage==='ready' ? 'badge-ready' : acc.stage==='live' ? 'badge-live' : 'badge-review');

  // proposal nav. Legacy rows may still store the old filename, which no longer
  // exists on the live site — map it to the current proposal path.
  const navP = document.getElementById('nav-proposal');
  // Each unit points at its OWN proposal via units.proposal_url.
  // Legacy rows storing the old filename are mapped to the Villa Dunes file;
  // a unit with no proposal_url shows no proposal at all (never another owner's).
  const VILLA_DUNES = '../JOOD Unit Transformation - Villa Dunes.html';
  const proposalHref = (u => {
    if (!u) return null;
    if (/JOOD(%20|\s)Unit(%20|\s)Transformation\.html$|index\.html$/i.test(u)) return VILLA_DUNES;
    return u;
  })(acc.proposalUrl);
  if (proposalHref){ navP.onclick = () => window.location.href = proposalHref; }
  else { navP.classList.add('disabled'); navP.title='Available once the design direction is confirmed'; }

  // overview: unit card
  document.getElementById('ov-unit-name').textContent = acc.unit;
  document.getElementById('ov-unit-location').textContent = acc.location;
  const specsWrap = document.getElementById('ov-specs');
  specsWrap.innerHTML='';
  acc.specs.forEach(([k,v])=> specsWrap.appendChild(el(`<div class="snap-cell"><div class="snap-k">${k}</div><div class="snap-v">${v}</div></div>`)));

  renderIncome();

  const actions = document.getElementById('ov-actions');
  actions.innerHTML='';
  actions.appendChild(el(`
    <a class="qa-btn ${proposalHref?'':'disabled'}" href="${proposalHref||'javascript:void(0)'}">
      Review transformation proposal &amp; rooms
      <svg width="12" height="9" viewBox="0 0 14 9" fill="none"><path d="M1 4.5h12M8 1l5 3.5L8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>`));

  // recent docs (top 2)
  const ovDocs = document.getElementById('ov-docs'); ovDocs.innerHTML='';
  acc.documents.slice(0,2).forEach(d=> ovDocs.appendChild(el(`
    <div class="list-row">
      <div class="list-icon">${d.tag}</div>
      <div class="list-body"><div class="list-title">${d.title}</div><div class="list-meta">${d.meta}</div></div>
    </div>`)));

  // recent messages (top 2)
  const ovMsgs = document.getElementById('ov-msgs'); ovMsgs.innerHTML='';
  acc.messages.slice(0,2).forEach(m=> ovMsgs.appendChild(el(`
    <div class="list-row">
      <div class="list-icon" style="background:var(--kite);color:var(--snow)">${m.from[0]}</div>
      <div class="list-body"><div class="list-title">${m.from}</div><div class="list-meta">${m.text.slice(0,64)}${m.text.length>64?'…':''}</div></div>
    </div>`)));

  // documents panel
  const docList = document.getElementById('doc-list'); docList.innerHTML='';
  if (!acc.documents.length){ docList.appendChild(el(`<div class="empty-note">No documents yet.</div>`)); }
  acc.documents.forEach(d=> docList.appendChild(el(`
    <div class="doc-row">
      <div class="doc-icon">${d.tag}</div>
      <div class="doc-body"><div class="doc-title">${d.title}</div><div class="doc-meta">${d.meta}</div></div>
      <button class="doc-dl" onclick="showToast('Demo document — download disabled in this preview')">Download</button>
    </div>`)));

  // messages panel
  const msgList = document.getElementById('msg-list'); msgList.innerHTML='';
  const anyUnread = acc.messages.some(m=>m.unread);
  document.getElementById('msgDot').style.display = anyUnread ? 'block' : 'none';
  acc.messages.forEach(m=> msgList.appendChild(el(`
    <div class="msg-row">
      <div class="msg-avatar">${m.from[0]}</div>
      <div class="msg-body">
        <div class="msg-head"><div class="msg-from">${m.from}</div><div class="msg-time">${m.time}</div></div>
        <div class="msg-text">${m.text}</div>
      </div>
      ${m.unread?'<div class="msg-unread"></div>':''}
    </div>`)));
}

function renderUnitPicker(){
  const sel = document.getElementById('tbUnitPick');
  if (!sel) return;
  if (acc.role !== 'admin' || allUnits.length === 0){ sel.hidden = true; return; }
  sel.hidden = false;
  sel.innerHTML = allUnits.map(u => '<option value="'+u.id+'"'+(u.id===acc.unitId?' selected':'')+'>'+u.name+'</option>').join('');
}
async function switchUnit(id){
  localStorage.setItem('jood_admin_unit', String(id));
  acc = await loadAccount();
  if (acc) render();
}

(async function init(){
  acc = await loadAccount();
  if (acc) render();
})();
</script>

<script src="../i18n/ar-dashboard.js"></script>
<script src="../i18n/jood-i18n.js"></script>

</body>
