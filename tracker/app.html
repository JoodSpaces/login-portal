<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOOD Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --snow:#F5F4ED; --mist:#ECECDC; --mist2:#D9D6C3; --kite:#351E1C; --garnet:#733635;
    --orange:#FF6037; --aqua:#A0C9CB; --mid:#8A6663; --border:rgba(53,30,28,.12);
    --serif:'Instrument Serif',Georgia,serif; --sans:'Geist',sans-serif; --mono:'Geist Mono',monospace;
    --r:12px; --sidebar-w:236px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  a{color:var(--kite);text-decoration:none} a:hover{color:var(--orange)}
  button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
  input,select,textarea{font-family:inherit}
  body{font-family:var(--sans);color:var(--kite);background:var(--mist);line-height:1.5;display:flex;min-height:100vh}
  ::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-thumb{background:var(--mid);border-radius:6px}

  /* SIDEBAR */
  .sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--kite);color:var(--snow);display:flex;flex-direction:column;padding:24px 16px;gap:22px;position:sticky;top:0;height:100vh}
  .sb-logo{padding:2px 8px}.sb-logo img{height:32px;width:auto;filter:brightness(0) invert(1)}
  .sb-tag{font-family:var(--mono);font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--aqua);padding:6px 8px 0}
  .sb-nav{display:flex;flex-direction:column;gap:2px}
  .sb-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;font-size:.84rem;font-weight:500;color:#DCCBC4;transition:background .18s,color .18s;width:100%;text-align:left}
  .sb-item svg{flex-shrink:0;opacity:.85}
  .sb-item:hover{background:rgba(245,244,237,.06);color:var(--snow)}
  .sb-item.active{background:var(--orange);color:var(--kite)}
  .sb-item.active svg{opacity:1}
  .sb-scope{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 4px}
  .sb-scope label{font-family:var(--mono);font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:#A98C84}
  .sb-scope select{background:rgba(245,244,237,.08);color:var(--snow);border:1px solid rgba(245,244,237,.14);border-radius:8px;padding:9px 10px;font-size:.8rem}
  .sb-manage{display:flex;align-items:center;justify-content:center;gap:7px;font-size:.74rem;font-weight:500;color:#DCCBC4;border:1px solid rgba(245,244,237,.14);border-radius:8px;padding:8px;transition:background .18s,color .18s}
  .sb-manage:hover{background:rgba(245,244,237,.06);color:var(--snow)}
  .sb-manage svg{opacity:.8}
  .sb-foot{border-top:1px solid rgba(245,244,237,.1);padding-top:14px;display:flex;flex-direction:column;gap:6px}
  .sb-account{display:flex;align-items:center;gap:10px;padding:2px 6px}
  .sb-avatar{width:32px;height:32px;border-radius:50%;background:rgba(245,244,237,.12);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.64rem;font-weight:600;flex-shrink:0}
  .sb-name{font-size:.78rem;font-weight:500}
  .sb-role{font-size:.62rem;color:#A98C84;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase}
  .sb-signout{font-size:.76rem;color:#A98C84;padding:8px 8px;display:flex;align-items:center;gap:9px;border-radius:8px}
  .sb-signout:hover{color:var(--orange);background:rgba(245,244,237,.05)}

  /* MAIN */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 34px;border-bottom:1px solid var(--border);background:rgba(245,244,237,.7);backdrop-filter:blur(10px);position:sticky;top:0;z-index:5}
  .tb-l{display:flex;align-items:center;gap:14px;min-width:0}
  .tb-title{font-family:var(--serif);font-size:1.5rem;font-weight:400}
  .tb-sub{font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mid);margin-top:2px}
  .tb-r{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .pill-select{border:1.5px solid var(--border);border-radius:40px;padding:9px 14px;font-size:.8rem;background:var(--snow);color:var(--kite)}
  .pill-select:focus{outline:none;border-color:var(--orange)}
  .btn-add{background:var(--kite);color:var(--snow);padding:10px 18px;border-radius:40px;font-size:.82rem;font-weight:500;display:flex;align-items:center;gap:7px;transition:background .2s}
  .btn-add:hover{background:var(--orange)}
  .menu-toggle{display:none}

  .content{padding:30px 34px 80px;max-width:1240px;width:100%}
  .panel{display:none}.panel.active{display:block;animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .eyebrow{font-family:var(--mono);font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mid);margin-bottom:8px}
  .h-serif{font-family:var(--serif);font-weight:400}
  .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
  .section-head h2{font-family:var(--serif);font-size:1.7rem;font-weight:400}
  .row-actions{display:flex;gap:8px;align-items:center}
  .btn-sm{border:1.5px solid var(--border);border-radius:40px;padding:8px 15px;font-size:.76rem;font-weight:500;color:var(--kite);display:inline-flex;align-items:center;gap:7px;transition:border-color .2s,color .2s,background .2s;background:var(--snow)}
  .btn-sm:hover{border-color:var(--orange);color:var(--kite);background:rgba(255,96,55,.05)}
  .btn-sm.solid{background:var(--kite);color:var(--snow);border-color:var(--kite)}
  .btn-sm.solid:hover{background:var(--orange);border-color:var(--orange)}

  /* STAT CARDS */
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
  .stat{background:var(--snow);border:1px solid var(--border);border-radius:var(--r);padding:20px}
  .stat .k{font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mid);margin-bottom:10px;display:flex;align-items:center;gap:7px}
  .stat .v{font-family:var(--serif);font-size:2rem;line-height:1}
  .stat .d{font-size:.74rem;color:var(--mid);margin-top:7px}
  .stat .d.up{color:#2c7a4b}.stat .d.down{color:var(--garnet)}
  .dot{width:8px;height:8px;border-radius:50%}
  .dot.o{background:var(--orange)}.dot.a{background:var(--aqua)}.dot.g{background:var(--garnet)}.dot.k{background:var(--kite)}

  .grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
  .card{background:var(--snow);border:1px solid var(--border);border-radius:var(--r);padding:22px}
  .card h3{font-family:var(--serif);font-size:1.15rem;font-weight:400;margin-bottom:2px}
  .card .lede{font-size:.78rem;color:var(--mid);margin-bottom:16px}

  /* TABLE */
  .table-wrap{background:var(--snow);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:.82rem}
  thead th{font-family:var(--mono);font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mid);text-align:left;padding:13px 16px;background:var(--mist);white-space:nowrap;font-weight:500}
  thead th.num,td.num{text-align:right}
  tbody td{padding:13px 16px;border-top:1px solid var(--border);vertical-align:middle}
  tbody tr{transition:background .12s}tbody tr:hover{background:rgba(255,96,55,.04)}
  .cell-strong{font-weight:500}
  .cell-sub{font-size:.72rem;color:var(--mid);margin-top:2px}
  .tag{font-family:var(--mono);font-size:.6rem;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:30px;white-space:nowrap;display:inline-block}
  .tag.airbnb{background:rgba(255,96,55,.14);color:var(--garnet)}
  .tag.booking{background:rgba(160,201,203,.28);color:#2c5658}
  .tag.direct{background:var(--mist2);color:var(--kite)}
  .tag.vrbo{background:rgba(53,30,28,.1);color:var(--kite)}
  .tag.paid{background:rgba(44,122,75,.14);color:#2c7a4b}
  .tag.pending{background:rgba(115,54,53,.12);color:var(--garnet)}
  .cat-dot{display:inline-flex;align-items:center;gap:8px}
  .row-btn{opacity:0;font-family:var(--mono);font-size:.6rem;letter-spacing:.05em;text-transform:uppercase;color:var(--mid);padding:5px 9px;border-radius:20px;transition:.15s}
  tr:hover .row-btn{opacity:1}.row-btn:hover{background:var(--mist);color:var(--kite)}
  .row-btn.del:hover{color:var(--garnet)}
  .empty-note{font-size:.84rem;color:var(--mid);padding:44px 20px;text-align:center}

  /* CALENDAR */
  .cal-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
  .cal-nav{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--kite)}
  .cal-nav:hover{border-color:var(--orange)}
  .cal-month{font-family:var(--serif);font-size:1.4rem;min-width:210px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--snow);border:1px solid var(--border);border-radius:var(--r);padding:14px}
  .cal-dow{font-family:var(--mono);font-size:.58rem;letter-spacing:.06em;text-transform:uppercase;color:var(--mid);text-align:center;padding:4px 0}
  .cal-cell{min-height:92px;border:1px solid var(--border);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:3px;background:#fff}
  .cal-cell.out{background:var(--mist);opacity:.5}
  .cal-cell.today{border-color:var(--orange);box-shadow:inset 0 0 0 1px var(--orange)}
  .cal-date{font-size:.68rem;color:var(--mid);font-weight:500}
  .cal-ev{font-size:.6rem;padding:3px 5px;border-radius:5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;line-height:1.3}
  .cal-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:.72rem;color:var(--mid)}
  .cal-legend span{display:inline-flex;align-items:center;gap:6px}
  .lg-sw{width:11px;height:11px;border-radius:3px}

  /* FINANCE */
  .fin-summary{display:grid;grid-template-columns:repeat(5,1fr);gap:0;background:var(--snow);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:22px}
  .fin-cell{padding:18px 20px;border-right:1px solid var(--border)}
  .fin-cell:last-child{border-right:none}
  .fin-cell .k{font-family:var(--mono);font-size:.58rem;letter-spacing:.07em;text-transform:uppercase;color:var(--mid);margin-bottom:8px}
  .fin-cell .v{font-family:var(--serif);font-size:1.55rem;line-height:1}
  .fin-cell .v.neg{color:var(--garnet)}.fin-cell .v.pos{color:#2c7a4b}
  .fin-tabs{display:flex;gap:6px;margin-bottom:16px}
  .fin-tab{padding:8px 16px;border-radius:40px;font-size:.78rem;font-weight:500;color:var(--mid);border:1.5px solid transparent}
  .fin-tab.active{background:var(--snow);border-color:var(--border);color:var(--kite)}

  /* REPORTS */
  .rep-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:16px}
  .chart-card{background:var(--snow);border:1px solid var(--border);border-radius:var(--r);padding:20px}
  .chart-card h3{font-family:var(--serif);font-size:1.1rem;font-weight:400;margin-bottom:2px}
  .chart-card .lede{font-size:.76rem;color:var(--mid);margin-bottom:14px}
  .chart-box{position:relative;height:230px}
  .chart-box.sm{height:200px}

  /* MODAL */
  .modal-bg{position:fixed;inset:0;background:rgba(53,30,28,.5);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:80;padding:24px}
  .modal-bg.show{display:flex}
  .modal{background:var(--snow);border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 40px 90px -25px rgba(0,0,0,.5)}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:22px 26px 0}
  .modal-head h3{font-family:var(--serif);font-size:1.4rem;font-weight:400}
  .modal-x{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--mid)}
  .modal-x:hover{background:var(--mist);color:var(--kite)}
  .modal-body{padding:20px 26px 26px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .modal-body .full{grid-column:1/-1}
  .fld{display:flex;flex-direction:column;gap:5px}
  .fld label{font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mid)}
  .fld input,.fld select,.fld textarea{padding:10px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:.85rem;color:var(--kite);background:#fff}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--orange)}
  .fld textarea{resize:vertical;min-height:60px}
  .modal-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 26px 24px}
  .modal-note{font-size:.72rem;color:var(--mid)}
  .modal-actions{display:flex;gap:10px;margin-left:auto}
  .btn-cancel{padding:11px 20px;border-radius:40px;font-size:.82rem;font-weight:500;color:var(--mid)}
  .btn-cancel:hover{color:var(--kite)}
  .btn-save{background:var(--kite);color:var(--snow);padding:11px 24px;border-radius:40px;font-size:.82rem;font-weight:500;transition:background .2s}
  .btn-save:hover{background:var(--orange)}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--kite);color:var(--snow);padding:12px 22px;border-radius:40px;font-size:.82rem;opacity:0;pointer-events:none;transition:.25s;z-index:100}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .sidebar-backdrop{display:none}
  @media (max-width:960px){
    .stat-grid{grid-template-columns:repeat(2,1fr)}.grid2,.rep-grid{grid-template-columns:1fr}
    .fin-summary{grid-template-columns:repeat(2,1fr)}.fin-cell{border-bottom:1px solid var(--border)}
    .menu-toggle{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:9px;border:1.5px solid var(--border);color:var(--kite)}
    .sidebar{position:fixed;left:0;top:0;z-index:90;transform:translateX(-100%);transition:transform .25s}
    .sidebar.open{transform:translateX(0)}
    .sidebar-backdrop.open{display:block;position:fixed;inset:0;background:rgba(53,30,28,.4);z-index:85}
    .content{padding:24px 18px 60px}.topbar{padding:16px 18px}
    .modal-body{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="sb-logo"><img src="images/jood-logo-dark.png" alt="JOOD"></div>
  <div class="sb-tag">Guest &amp; Finance Tracker</div>
  <nav class="sb-nav" id="nav">
    <button class="sb-item active" data-panel="dashboard"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1.5" y="1.5" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="8.5" y="1.5" width="6" height="9" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="1.5" y="9.5" width="6" height="5" rx="1" stroke="currentColor" stroke-width="1.4"/></svg>Dashboard</button>
    <button class="sb-item" data-panel="bookings"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M1.5 5.5h13M5 1.5v2M11 1.5v2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Bookings</button>
    <button class="sb-item" data-panel="calendar"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M1.5 5.5h13" stroke="currentColor" stroke-width="1.4"/><rect x="4" y="7.5" width="2.5" height="2.5" rx=".5" fill="currentColor"/></svg>Calendar</button>
    <button class="sb-item" data-panel="finances"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1.5v13M11 4.5c0-1.4-1.3-2.2-3-2.2s-3 .8-3 2.2 1.3 2 3 2.4 3 1 3 2.4-1.3 2.2-3 2.2-3-.8-3-2.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>Finances</button>
    <button class="sb-item" data-panel="reports"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M1.5 14.5V1.5M14.5 14.5h-13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M4 11l3-3 2 2 4-4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Reports</button>
  </nav>
  <div class="sb-scope">
    <label for="unitFilter">Unit</label>
    <select id="unitFilter"></select>
    <button class="sb-manage" id="manageUnitsBtn"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Manage units</button>
  </div>
  <div class="sb-foot">
    <div class="sb-account">
      <div class="sb-avatar" id="sbAvatar">—</div>
      <div style="min-width:0"><div class="sb-name" id="sbName">—</div><div class="sb-role" id="sbRole">—</div></div>
    </div>
    <a class="sb-signout" href="../portal/dashboard.html" style="text-decoration:none"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M8.5 3.5 5 7l3.5 3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>Back to Owner Portal</a>
    <button class="sb-signout" id="signOutBtn"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5.5 1.5H2.5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M9 4.5 12 7l-3 2.5M12 7H5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>Sign out</button>
  </div>
</aside>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<main class="main">
  <div class="topbar">
    <div class="tb-l">
      <button class="menu-toggle" id="menuToggle" aria-label="Menu"><svg width="18" height="14" viewBox="0 0 18 14" fill="none"><path d="M1 1h16M1 7h16M1 13h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      <div><div class="tb-title" id="tbTitle">Dashboard</div><div class="tb-sub" id="tbSub">—</div></div>
    </div>
    <div class="tb-r">
      <select class="pill-select" id="periodFilter"></select>
      <button class="btn-add" id="addBtn"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span id="addLabel">Add booking</span></button>
    </div>
  </div>

  <div class="content">
    <section class="panel active" id="panel-dashboard"></section>
    <section class="panel" id="panel-bookings"></section>
    <section class="panel" id="panel-calendar"></section>
    <section class="panel" id="panel-finances"></section>
    <section class="panel" id="panel-reports"></section>
  </div>
</main>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="supabase-client.js"></script>
<script src="app.js"></script>
</body>
</html>
