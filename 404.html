<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JOOD — Page not found</title>
<script>
// GitHub Pages serves this for any unknown path. Old links (renamed files,
// bookmarks with spaces) land here — send the proposal ones to the homepage
// rather than showing a dead end.
(function () {
  var p = decodeURIComponent(location.pathname).toLowerCase();
  var base = location.pathname.split('/').slice(0, 2).join('/') + '/';
  if (p.indexOf('transformation') > -1 || p.indexOf('room') > -1) {
    location.replace(base + location.search + location.hash);
  }
})();
</script>

</head>
